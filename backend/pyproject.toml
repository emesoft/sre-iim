[project]
name = "iim-backend"
version = "0.1.0"
description = "IIM (Intelligent Incident Management) backend - FastAPI + LangChain + RAG over pgvector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pgvector>=0.3",
    # M2: analysis brain calls Bedrock via LangChain (also provides boto3 for Step 0 reuse).
    "langchain-aws>=0.2",
    "langchain-core>=0.3",
    # M3/decision 0016: DeepSeek + Jina provider adapters call REST APIs directly.
    "httpx>=0.27",
    "langgraph>=1.2.9",
    # CloudWatch Logs Insights log search (feature: on-demand log search from an incident).
    "boto3>=1.34",
    "cryptography>=42.0",
    "apscheduler>=3.10",
    # MCP stdio server for the incident-chat fetch_logs tool (design spec 2026-08-23) — spawned by
    # `claude -p --mcp-config` as a short-lived subprocess per chat turn.
    "mcp>=1.2,<2",
    # Per-user auth (JWT access tokens + bcrypt password hashing).
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

# This is an application, not a distributable library: uv should manage the
# environment without invoking a build backend. https://docs.astral.sh/uv/concepts/projects/
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
