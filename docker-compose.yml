# IIM local stack: Postgres (pgvector) + backend (FastAPI) + frontend (static
# build served by nginx). Lives at the repo root (alongside backend/ and
# frontend/) so it's just:
#   docker compose up --build
# pgvector image: https://hub.docker.com/r/pgvector/pgvector
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iim}
      POSTGRES_USER: ${POSTGRES_USER:-iim}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iim}
    ports:
      # Host port is configurable to avoid clashes with other local Postgres instances.
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iim} -d ${POSTGRES_DB:-iim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # The container gets no .env of its own (it's in .dockerignore), so every setting the backend
    # reads has to be forwarded here. Values come from a .env at the repo root; see backend/env.example.
    environment:
      # --- Analysis pipeline ---
      ANALYSIS_MODE: ${ANALYSIS_MODE:-single}
      MAX_ROUNDS: ${MAX_ROUNDS:-2}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-1800}
      # --- LLM provider: bedrock | deepseek (any OpenAI-compatible endpoint) | claude_cli (local demo only) ---
      LLM_PROVIDER: ${LLM_PROVIDER:-bedrock}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      MODEL_ID: ${MODEL_ID:-anthropic.claude-3-5-haiku-20241022-v1:0}
      FAST_MODEL_ID: ${FAST_MODEL_ID:-anthropic.claude-3-5-haiku-20241022-v1:0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1500}
      CLAUDE_CLI_MODEL: ${CLAUDE_CLI_MODEL:-sonnet}
      # --- Embedding provider: titan | jina. EMBEDDING_DIM is read by migration 0002 at startup. ---
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-titan}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-amazon.titan-embed-text-v2:0}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      JINA_API_KEY: ${JINA_API_KEY:-}
      # --- Demo mode: synthetic log lines, no cloud account needed ---
      DEMO_LOGS: ${DEMO_LOGS:-false}
      # --- Azure DevOps ticketing (the one-click ticket action is inert without these) ---
      AZDO_ORG: ${AZDO_ORG:-}
      AZDO_PROJECT: ${AZDO_PROJECT:-}
      AZDO_PAT: ${AZDO_PAT:-}
      # --- CloudWatch alarm polling: encryption key for storing access keys ---
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      # --- Settings-page admin gate: single shared password, not per-user accounts ---
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-iim}:${DB_PASSWORD:-iim}@db:5432/${POSTGRES_DB:-iim}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Mounts the host's AWS SSO profiles/cached tokens so CloudWatch log search can authenticate
      # per-project (PROJECT_<SERVICE>_AWS_PROFILE, see backend/app/infrastructure/config.py) —
      # run `aws sso login --profile <name>` on the host first; the container only reads the cache.
      - ${AWS_CONFIG_DIR:-~/.aws}:/root/.aws:ro

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"

volumes:
  pgdata:
