server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same relative-API pattern as the Vite dev proxy (vite.config.ts) — proxy
    # to the backend service by its Docker Compose service name.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE incident-analysis stream: buffering would hold each event until nginx's buffer
    # fills or the response ends, defeating live progress (SSE streaming design, decision
    # 2026-07-20).
    location ~ ^/api/incidents/[^/]+/stream$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Incident chat: a turn can include one or more fetch_logs tool calls (each a real CloudWatch
    # Logs Insights query, which itself polls for up to ~30s), so the default 60s read timeout is
    # too short. 300s covers a chat turn with a few tool calls.
    location ~ ^/api/incidents/[^/]+/chat$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://backend:8000/healthz;
    }

    # The Entra sign-in popup lands here. Served as a static do-nothing page instead of falling
    # through to the SPA: booting the app inside MSAL's own popup is what produced
    # `block_nested_popups`, and the popup has no reason to download the bundle at all.
    location = /auth/callback {
        try_files /auth-callback.html =404;
        add_header Cache-Control "no-cache";
    }

    # Hashed build output: the filename changes whenever the content does, so it can be cached
    # hard and forever. This is what makes the no-cache on index.html below cheap.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — unknown paths resolve to index.html for client-side routing.
    #
    # index.html is the one file that must never be cached: it is the pointer to the hashed bundles,
    # so a stale copy pins the whole app to an old build. Served with only an ETag (no explicit
    # Cache-Control) a browser is free to apply heuristic freshness and reuse it without asking —
    # which is exactly how a deploy can land on the server and never reach the person looking at it.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
